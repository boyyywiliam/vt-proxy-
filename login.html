<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Threat Intelligence MTM — Login</title>
  <meta name="description" content="Login portal untuk Threat Intelligence MTM – Platform Threat Hunting internal SOC." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --card:      #161d2e;
      --border:    rgba(255,255,255,.07);
      --accent:    #00d4aa;
      --accent2:   #0ea5e9;
      --danger:    #ef4444;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── animated background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(0,212,170,.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(14,165,233,.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── grid dots overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px 40px;
      box-shadow:
        0 0 0 1px rgba(0,212,170,.04),
        0 24px 64px rgba(0,0,0,.5),
        0 0 80px rgba(0,212,170,.04);
      animation: slideUp .5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── logo / brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 0 20px rgba(0,212,170,.3);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-text span {
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* ── divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
    }

    /* ── heading ── */
    .heading { margin-bottom: 24px; }
    .heading h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    .heading p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── form ── */
    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--muted);
      pointer-events: none;
      transition: color .2s;
    }

    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 44px 12px 42px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .input-wrap input:focus {
      border-color: var(--accent);
      background: rgba(0,212,170,.04);
      box-shadow: 0 0 0 3px rgba(0,212,170,.12);
    }

    .input-wrap input:focus + .icon,
    .input-wrap input:focus ~ .icon {
      color: var(--accent);
    }

    .input-wrap input::placeholder { color: var(--muted); opacity: .6; }

    /* Eye toggle button */
    .eye-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      padding: 4px;
      line-height: 1;
      transition: color .2s;
    }
    .eye-toggle:hover { color: var(--accent); }

    /* ── alert ── */
    .alert {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 20px;
      animation: fadeIn .3s ease;
    }
    .alert.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    /* ── submit btn ── */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(0,212,170,.25);
      margin-top: 6px;
    }
    .btn-login:hover:not(:disabled) {
      opacity: .9;
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(0,212,170,.35);
    }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    /* loading spinner inside button */
    .btn-login .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── footer ── */
    .card-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .card-footer i { font-size: 12px; color: var(--accent); }
  </style>
</head>
<body>
<div class="page">
  <div class="card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <i class="bi bi-shield-shaded"></i>
      </div>
      <div class="brand-text">
        <h1>Threat Intelligence MTM</h1>
        <span>Security Operations Center — MTM</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Heading -->
    <div class="heading">
      <h2>Selamat Datang</h2>
      <p>Masuk untuk mengakses dashboard threat intelligence</p>
    </div>

    <!-- Error alert -->
    <div class="alert" id="alertBox" role="alert">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span id="alertMsg">Username atau password salah.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            autocomplete="username"
            required
          />
          <i class="bi bi-person icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          />
          <i class="bi bi-lock icon"></i>
          <button type="button" class="eye-toggle" id="eyeToggle" title="Tampilkan password">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text"><i class="bi bi-box-arrow-in-right"></i> &nbsp;Masuk</span>
        <div class="spinner"></div>
      </button>
    </form>

    <!-- Footer -->
    <div class="card-footer">
      <i class="bi bi-shield-lock-fill"></i>
      Akses terbatas untuk pegawai MTM
    </div>

  </div>
</div>

<script>
  // ── Eye toggle ──────────────────────────────────────────────────────────────
  const pwdInput  = document.getElementById('password');
  const eyeToggle = document.getElementById('eyeToggle');
  const eyeIcon   = document.getElementById('eyeIcon');

  eyeToggle.addEventListener('click', () => {
    const show = pwdInput.type === 'password';
    pwdInput.type = show ? 'text' : 'password';
    eyeIcon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  });

  // ── Form submit ─────────────────────────────────────────────────────────────
  const form     = document.getElementById('loginForm');
  const btn      = document.getElementById('loginBtn');
  const alertBox = document.getElementById('alertBox');
  const alertMsg = document.getElementById('alertMsg');

  function showError(msg) {
    alertMsg.textContent = msg;
    alertBox.classList.add('show');
    btn.classList.remove('loading');
    btn.disabled = false;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.remove('show');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showError('Username dan password wajib diisi.');
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const body = new URLSearchParams({ username, password });
      const res  = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });

      if (res.ok) {
        // Redirect ke dashboard
        window.location.href = '/ui';
      } else {
        const data = await res.json().catch(() => ({}));
        showError(data.detail || 'Username atau password salah.');
      }
    } catch (err) {
      showError('Gagal terhubung ke server. Coba lagi.');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
